apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: client-app
  template:
    metadata:
      labels:
        app: client-app
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: client-container
          image: meetdev.azurecr.io/devconnect-frontend:v1
          ports:
            - containerPort: 80
